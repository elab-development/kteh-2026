    <!-- Kontakt forma -->
    <div class="kontakt-forma">
      <h1>Kontaktirajte nas</h1>
      <form action="#" method="post" id="kontakt">
        <label for="ime">Ime:</label>
        <input type="text" id="ime" name="ime" required />

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required />

        <label for="poruka">Poruka:</label>
        <textarea id="poruka" name="poruka" rows="5" required></textarea>

        <!-- Inline JavaScript -->
        <!-- <button type="submif" onclick="alert('Uspesno ste poslali upit!')">Pošalji</button> -->
         <button type="submit" onclick="PotvrdaForme()">Pošalji</button>
      </form>
    </div>

    <script src="js/main.js"></script>
  </body>
